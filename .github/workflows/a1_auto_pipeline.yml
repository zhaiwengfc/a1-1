name: A1 Low-Altitude Hub & Sky Mall Auto Pipeline (Daily 07:00 & 09:00)

on:
  schedule:
    - cron: '35 22 * * *'
    - cron: '40 0 * * *'
  workflow_dispatch:
    inputs:
      task_mode:
        description: '选择要立即执行的自动更新任务 (all / crawl_0700 / newsroom_0900 / mall_sync)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - crawl_0700
          - newsroom_0900
          - mall_sync

permissions:
  contents: write

jobs:
  a1-daily-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zhaiwengfc/a1-1 repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run 07:00 Daily Multi-Source News Crawler
        if: github.event.schedule == '35 22 * * *' || github.event.inputs.task_mode == 'crawl_0700' || github.event.inputs.task_mode == 'all' || github.event_name == 'workflow_dispatch'
        run: |
          python3 scripts/daily_crawler.py

      - name: Run Daily Sky Mall Official Product & Price Sync
        if: github.event.schedule == '35 22 * * *' || github.event.inputs.task_mode == 'mall_sync' || github.event.inputs.task_mode == 'all' || github.event_name == 'workflow_dispatch'
        run: |
          python3 scripts/daily_mall_updater.py

      - name: Run 09:00 Daily A1 Newsroom Article Writer
        if: github.event.schedule == '40 0 * * *' || github.event.inputs.task_mode == 'newsroom_0900' || github.event.inputs.task_mode == 'all'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 scripts/daily_newsroom_writer.py

      - name: Commit and Push Real-Time Updates to GitHub Pages (zhaiwengfc/a1-1)
        run: |
          git config user.name "A1-Portal-Agent"
          git config user.email "agent@a1-portal.local"
          git add data/news.json data/mall_products.json
          git diff --staged --quiet || (git commit -m "chore(a1-agent): auto-update daily news, A1 newsroom & Sky Mall products [skip ci]" && git push)
